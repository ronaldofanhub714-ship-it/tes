# cloudflare-pages.toml
# ────────────────────────────────────────────────────────────────────────
#  Cloudflare Pages build configuration.
#  Place this file in the repository root so Pages can read it during build.
#
#  build.command     — Command executed to build the site.  The default is
#                      "npm run build".  If you need to install npm
#                      dependencies first, use "npm install && npm run build".
#
#  build.output_dir  — Directory that contains the files to be served.  For
#                      a Vite project this is the default "dist".
#
#  preview.command   — Optional.  Command to run for local preview.  Not used by
#                      CI, but handy if you ever want to run Pages builds
#                      locally.
#
#  dev.command       — Optional.  Command for Cloudflare Workers‑preview.
#
[build]
command = "npm run build"
output_dir = "dist"

# If you wish to have Pages start the dev server for a local preview, add:
# [preview]
# command = "npm run dev"

# For workers preview (rarely needed):
# [dev]
# command = "npx vite preview"
